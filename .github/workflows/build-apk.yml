name: Compilar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js y Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar proyecto Capacitor
        run: |
          bun scripts/prepare-android.ts /tmp/android-build
          cd /tmp/android-build
          bun install
          bunx cap add android
          bunx cap sync android

      - name: Compilar APK Debug
        run: |
          cd /tmp/android-build/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK para descarga
        uses: actions/upload-artifact@v4
        with:
          name: Don-Cangrejo-Pro-APK
          path: /tmp/android-build/android/app/build/outputs/apk/debug/app-debug.apk
